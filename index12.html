<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maritime ERP</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/erp-base.css">
    <link rel="stylesheet" href="assets/gantt.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

<!-- ── App shell ─────────────────────────────────────────────── -->
<div id="app" class="h-screen flex flex-col overflow-hidden">

    <!-- Top bar -->
    <header class="bg-slate-900 text-white flex items-center justify-between px-5 shrink-0" style="height:48px">
        <div class="flex items-center gap-3">
            <!-- Sidebar toggle -->
            <button @click="sidebarOpen = !sidebarOpen"
                    class="w-7 h-7 flex flex-col items-center justify-center gap-1.5 rounded hover:bg-slate-700 transition shrink-0">
                <span class="block w-4 h-0.5 bg-slate-300"></span>
                <span class="block w-4 h-0.5 bg-slate-300"></span>
                <span class="block w-4 h-0.5 bg-slate-300"></span>
            </button>
            <h1 class="text-base font-bold tracking-tight leading-none">
                MARITIME<span class="text-blue-400">ERP</span>
            </h1>
        </div>
        <div class="flex items-center gap-3 text-xs">
            <span class="text-slate-400">Welcome, <strong class="text-slate-200">Ops_User_01</strong></span>
            <div class="w-7 h-7 bg-blue-500 rounded-full flex items-center justify-center text-xs font-bold shrink-0">JD</div>
        </div>
    </header>

    <!-- Body: sidebar + content -->
    <div class="flex flex-1 overflow-hidden">

        <!-- ── Sidebar ──────────────────────────────────────── -->
        <aside :class="['bg-slate-800 flex flex-col shrink-0 overflow-y-auto transition-all duration-200',
                         sidebarOpen ? 'w-52' : 'w-0']"
               style="min-width:0">
            <nav class="flex-1 py-3 select-none">

                <!-- Admin -->
                <div>
                    <button @click="toggleSection('admin')"
                            class="w-full flex items-center justify-between px-4 py-2.5 text-left hover:bg-slate-700 transition group">
                        <div class="flex items-center gap-2.5">
                            <span class="text-slate-400 text-sm">⚙</span>
                            <span class="text-xs font-bold uppercase tracking-widest text-slate-300 group-hover:text-white transition whitespace-nowrap">Admin</span>
                        </div>
                        <span :class="['text-slate-500 text-[10px] transition-transform', openSections.admin ? 'rotate-90' : '']">▶</span>
                    </button>
                    <div v-show="openSections.admin" class="pl-4">
                        <router-link to="/admin/users"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="text-white bg-slate-700">
                            Users
                        </router-link>
                        <router-link to="/admin/clients"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="text-white bg-slate-700">
                            Clients Setup
                        </router-link>
                        <router-link to="/admin/settings"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="text-white bg-slate-700">
                            Settings
                        </router-link>
                    </div>
                </div>

                <!-- Recruitment -->
                <div>
                    <button @click="toggleSection('recruitment')"
                            class="w-full flex items-center justify-between px-4 py-2.5 text-left hover:bg-slate-700 transition group">
                        <div class="flex items-center gap-2.5">
                            <span class="text-slate-400 text-sm">👥</span>
                            <span class="text-xs font-bold uppercase tracking-widest text-slate-300 group-hover:text-white transition whitespace-nowrap">Recruitment</span>
                        </div>
                        <span :class="['text-slate-500 text-[10px] transition-transform', openSections.recruitment ? 'rotate-90' : '']">▶</span>
                    </button>
                    <div v-show="openSections.recruitment" class="pl-4">
                        <router-link to="/recruitment/candidates"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="text-white bg-slate-700">
                            Candidates
                        </router-link>
                        <router-link to="/recruitment/pipeline"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="text-white bg-slate-700">
                            Pipeline
                        </router-link>
                    </div>
                </div>

                <!-- Operations -->
                <div>
                    <button @click="toggleSection('operations')"
                            class="w-full flex items-center justify-between px-4 py-2.5 text-left hover:bg-slate-700 transition group">
                        <div class="flex items-center gap-2.5">
                            <span class="text-slate-400 text-sm">🚢</span>
                            <span class="text-xs font-bold uppercase tracking-widest text-slate-300 group-hover:text-white transition whitespace-nowrap">Operations</span>
                        </div>
                        <span :class="['text-slate-500 text-[10px] transition-transform', openSections.operations ? 'rotate-90' : '']">▶</span>
                    </button>
                    <div v-show="openSections.operations" class="pl-4">
                        <router-link to="/operations/rotation"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="!text-white !bg-blue-600 font-semibold">
                            Rotation Plan
                        </router-link>
                        <router-link to="/operations/rfas"
                            class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 transition rounded-sm whitespace-nowrap"
                            active-class="!text-white !bg-blue-600 font-semibold">
                            RFAs
                        </router-link>
                    </div>
                </div>

            </nav>

            <!-- Sidebar footer -->
            <div class="px-4 py-3 border-t border-slate-700 text-[10px] text-slate-500 whitespace-nowrap">
                v2.4 — Maritime ERP
            </div>
        </aside>

        <!-- ── Content area ─────────────────────────────────── -->
        <main class="flex-1 flex flex-col overflow-hidden bg-gray-50">
            <router-view class="flex-1 flex flex-col overflow-hidden"></router-view>
        </main>

    </div>
</div>

<!-- ── ClientsSetup x-template ──────────────────────────────── -->
<script type="text/x-template" id="tpl-clients-setup">
<div class="flex-1 flex flex-col overflow-hidden">

    <!-- Sub-nav (matches Rotation Plan style) -->
    <nav class="bg-white border-b flex px-8 shadow-sm shrink-0">
        <button class="active-tab py-3 px-1 text-sm">CLIENTS SETUP</button>
    </nav>

    <!-- Client selector bar -->
    <div class="bg-white border-b px-8 py-3 flex items-center gap-4 shrink-0">
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Client</label>
        <select v-model="selectedClientId"
                class="text-sm border rounded px-3 py-1.5 bg-white min-w-[260px] focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">— select a client —</option>
            <option v-for="c in clients" :key="c.id" :value="c.id">
                {{ c.name }} ({{ c.alias }})
            </option>
        </select>
        <!-- Active badge -->
        <span v-if="selectedClient"
              :class="['text-[10px] font-black uppercase px-2.5 py-1 rounded-full border',
                       selectedClient.isActive
                         ? 'bg-emerald-50 text-emerald-700 border-emerald-300'
                         : 'bg-red-50 text-red-600 border-red-300']">
            {{ selectedClient.isActive ? '● Active' : '● Inactive' }}
        </span>
    </div>

    <!-- Empty state -->
    <div v-if="!selectedClient"
         class="flex-1 flex flex-col items-center justify-center gap-3 text-gray-300">
        <div class="text-5xl">🏢</div>
        <div class="text-base font-semibold text-gray-400">Select a client to view details</div>
    </div>

    <!-- Client detail panel -->
    <div v-else class="flex-1 overflow-auto px-5 py-5">

        <!-- Tab bar -->
        <div class="flex gap-0 border-b mb-6">
            <button v-for="tab in [{id:'details',label:'Details'},{id:'vessels',label:'Vessels'},{id:'salary',label:'Salary Ranges'},{id:'documents',label:'Documents'}]"
                    :key="tab.id"
                    @click="activeTab = tab.id; editing = false"
                    :class="['px-5 py-2.5 text-sm font-semibold border-b-2 transition -mb-px',
                             activeTab === tab.id
                               ? 'border-blue-600 text-blue-600'
                               : 'border-transparent text-gray-400 hover:text-gray-600']">
                {{ tab.label }}
            </button>
        </div>

        <!-- ── DETAILS TAB ─────────────────────────────────── -->
        <div v-show="activeTab === 'details'">

            <!-- View mode -->
            <div v-if="!editing" class="max-w-2xl">
                <div class="flex items-start justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800 leading-tight">{{ selectedClient.name }}</h2>
                        <div class="text-sm text-slate-400 mt-0.5">{{ selectedClient.alias }}</div>
                    </div>
                    <button @click="startEdit"
                            class="px-4 py-2 text-xs font-bold rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                        ✏ Edit
                    </button>
                </div>

                <!-- Detail grid -->
                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-white rounded-xl border border-gray-200 px-6 py-5 grid grid-cols-2 gap-x-8 gap-y-4">

                        <div>
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Full Name</div>
                            <div class="text-sm font-semibold text-gray-800">{{ selectedClient.name }}</div>
                        </div>
                        <div>
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Alias / Short Code</div>
                            <div class="text-sm font-semibold text-gray-800">{{ selectedClient.alias }}</div>
                        </div>
                        <div class="col-span-2">
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Address</div>
                            <div class="text-sm text-gray-700">{{ selectedClient.address }}</div>
                        </div>
                        <div>
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Contact Email</div>
                            <div class="text-sm text-blue-600">{{ selectedClient.contactEmail }}</div>
                        </div>
                        <div>
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Contact Phone</div>
                            <div class="text-sm text-gray-700">{{ selectedClient.contactPhone }}</div>
                        </div>
                        <div>
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Status</div>
                            <span :class="['inline-block text-xs font-bold px-2.5 py-1 rounded-full',
                                           selectedClient.isActive
                                             ? 'bg-emerald-100 text-emerald-700'
                                             : 'bg-red-100 text-red-600']">
                                {{ selectedClient.isActive ? 'Active' : 'Inactive' }}
                            </span>
                        </div>
                        <div>
                            <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Vessels on Contract</div>
                            <div class="text-sm font-semibold text-gray-800">{{ selectedClient.vesselIds.length }}</div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Edit mode -->
            <div v-else class="max-w-2xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-base font-bold text-slate-700">Editing — {{ selectedClient.name }}</h2>
                    <div class="flex gap-2">
                        <button @click="cancelEdit"
                                class="px-4 py-2 text-xs font-semibold rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">Cancel</button>
                        <button @click="saveEdit"
                                class="px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">Save</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 px-6 py-5 grid grid-cols-2 gap-x-6 gap-y-5">

                    <div class="col-span-2">
                        <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Full Name</label>
                        <input type="text" v-model="editForm.name"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Alias / Short Code</label>
                        <input type="text" v-model="editForm.alias"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Status</label>
                        <div class="flex items-center gap-3 h-9">
                            <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 select-none">
                                <input type="checkbox" v-model="editForm.isActive" class="w-4 h-4 accent-blue-600">
                                Active
                            </label>
                        </div>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Address</label>
                        <input type="text" v-model="editForm.address"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Contact Email</label>
                        <input type="email" v-model="editForm.contactEmail"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Contact Phone</label>
                        <input type="text" v-model="editForm.contactPhone"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>

                </div>
            </div>
        </div>

        <!-- ── VESSELS TAB ─────────────────────────────────── -->
        <div v-show="activeTab === 'vessels'">

            <!-- Vessel picker -->
            <div class="flex items-center gap-3 mb-6">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest shrink-0">Vessel</label>
                <select v-model="selectedVesselId"
                        class="text-sm border rounded px-3 py-1.5 bg-white min-w-[280px] focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">— select a vessel —</option>
                    <option v-for="v in clientVessels" :key="v.id" :value="v.id">
                        {{ v.name }} · {{ v.type }}
                    </option>
                </select>
                <span v-if="selectedVessel" class="text-lg" :title="selectedVessel.flag">{{ flagEmoji(selectedVessel.flag) }}</span>
                <span v-if="selectedVessel" class="text-[10px] text-gray-500 font-semibold">{{ selectedVessel.flag }}</span>
            </div>

            <!-- Empty state -->
            <div v-if="!selectedVessel" class="text-gray-400 text-sm italic py-8 text-center">
                Select a vessel above to view and edit its details.
            </div>

            <!-- Vessel detail panel -->
            <div v-else class="w-full">

                <!-- Vessel sub-tab bar -->
                <div class="flex gap-0 border-b mb-5">
                    <button v-for="vt in [{id:'vdetails',label:'Details'},{id:'vranks',label:'Ranks & Manning'},{id:'vcontract',label:'Contract Definition'}]"
                            :key="vt.id"
                            @click="vesselTab = vt.id; vesselEditing = false; vesselRanksEditing = false"
                            :class="['px-5 py-2 text-xs font-semibold border-b-2 transition -mb-px',
                                     vesselTab === vt.id
                                       ? 'border-slate-700 text-slate-800'
                                       : 'border-transparent text-gray-400 hover:text-gray-600']">
                        {{ vt.label }}
                    </button>
                </div>

                <!-- ── VESSEL DETAILS sub-tab ── -->
                <div v-show="vesselTab === 'vdetails'">

                    <!-- View -->
                    <div v-if="!vesselEditing">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">{{ vesselTypeIcon(selectedVessel.type) }}</span>
                                <div>
                                    <div class="text-lg font-bold text-slate-800">{{ selectedVessel.name }}</div>
                                    <div class="text-[10px] text-slate-400 uppercase tracking-widest">{{ selectedVessel.type }}</div>
                                </div>
                            </div>
                            <button @click="startVesselEdit"
                                    class="px-4 py-2 text-xs font-bold rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">✏ Edit</button>
                        </div>

                        <div class="bg-white rounded-xl border border-gray-200 px-6 py-5 grid grid-cols-2 gap-x-8 gap-y-4">
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">IMO Number</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.imo || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Year Built</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.built || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Gross Tonnage</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.gt ? selectedVessel.gt.toLocaleString() + ' GT' : '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Flag State</div>
                                <div class="text-sm font-semibold text-gray-800">{{ flagEmoji(selectedVessel.flag) }} {{ selectedVessel.flag }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Vessel Type</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.type }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Classification Society</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.classificationSociety || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Main Engine</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.engineType || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Engine Power</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.enginePower || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">P&amp;I Club</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.piClub || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Hull Insurer</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.hullInsurer || '—' }}</div>
                            </div>
                            <div>
                                <div class="text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Hull Insured Value</div>
                                <div class="text-sm font-semibold text-gray-800">{{ selectedVessel.hullValue || '—' }}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Edit -->
                    <div v-else>
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Editing — {{ selectedVessel.name }}</div>
                            <div class="flex gap-2">
                                <button @click="vesselEditing = false"
                                        class="px-4 py-2 text-xs font-semibold rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">Cancel</button>
                                <button @click="saveVesselEdit"
                                        class="px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">Save</button>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl border border-gray-200 px-6 py-5 grid grid-cols-2 gap-x-6 gap-y-4">
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">IMO Number</label>
                                <input type="text" v-model="vesselEditForm.imo"
                                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Year Built</label>
                                <input type="number" v-model.number="vesselEditForm.built"
                                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Gross Tonnage</label>
                                <input type="number" v-model.number="vesselEditForm.gt"
                                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Flag State</label>
                                <input type="text" v-model="vesselEditForm.flag"
                                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Vessel Type</label>
                                <select v-model="vesselEditForm.type"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                                    <option>Oil Tanker</option>
                                    <option>Chemical Tanker</option>
                                    <option>Bulk Carrier</option>
                                    <option>Container</option>
                                    <option>RoRo</option>
                                    <option>LNG Carrier</option>
                                    <option>General Cargo</option>
                                    <option>Offshore Supply</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Classification Society</label>
                                <input type="text" v-model="vesselEditForm.classificationSociety"
                                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-black uppercase text-gray-400 tracking-widest mb-1">Main Engine</label>

            </div>

            <!-- Empty state: no doc types yet -->
            <div v-if="clientDocTypes.length === 0 && !addingDocType"
                 class="text-gray-400 text-sm italic py-8 text-center border-2 border-dashed border-gray-200 rounded-xl">
                No document types defined yet. Click "+ Add document type" to start.
            </div>

            <!-- Matrix table -->
            <div v-else-if="clientDocTypes.length > 0"
                 class="overflow-auto rounded-xl border border-gray-200 bg-white">
                <table class="text-xs border-collapse" style="min-width:100%">
                    <thead>
                        <!-- Rank headers -->
                        <tr>
                            <th class="bg-slate-800 text-white px-4 py-3 text-left text-[10px] font-black uppercase tracking-widest sticky left-0 z-10 min-w-[220px]"
                                style="box-shadow:2px 0 4px rgba(0,0,0,0.12)">
                                Document Type
                            </th>
                            <th v-for="rank in docRankOrder" :key="rank"
                                class="bg-slate-800 text-white px-2 py-3 text-center text-[9px] font-black uppercase tracking-widest whitespace-nowrap"
                                style="min-width:72px; writing-mode:vertical-rl; transform:rotate(180deg); height:110px; vertical-align:bottom">
                                {{ rank }}
                            </th>
                            <th class="bg-slate-800 px-3 py-3" style="min-width:36px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(doc, dIdx) in clientDocTypes" :key="doc.id"
                            :class="['border-b border-gray-100 last:border-b-0 hover:bg-blue-50 transition-colors group',
                                     dIdx % 2 === 0 ? 'bg-white' : 'bg-gray-50']">

                            <!-- Document type name (sticky left, editable on click) -->
                            <td class="px-4 py-2.5 sticky left-0 z-10 group-hover:bg-blue-50 transition-colors"
                                :class="dIdx % 2 === 0 ? 'bg-white' : 'bg-gray-50'"
                                style="box-shadow:2px 0 4px rgba(0,0,0,0.06)">
                                <div v-if="editingDocName !== doc.id"
                                     class="flex items-center gap-2">
                                    <span class="font-semibold text-slate-700">{{ doc.name }}</span>
                                    <button @click="startEditDocName(doc)"
                                            class="opacity-0 group-hover:opacity-100 text-[9px] text-blue-400 hover:text-blue-600 transition px-1">✏</button>
                                </div>
                                <div v-else class="flex items-center gap-2">
                                    <input type="text" v-model="editDocNameVal"
                                           @keyup.enter="saveDocName(doc)"
                                           @keyup.escape="editingDocName = null"
                                           @blur="saveDocName(doc)"
                                           class="flex-1 border border-blue-400 rounded px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400 min-w-0">
                                </div>
                            </td>

                            <!-- Checkbox per rank -->
                            <td v-for="rank in docRankOrder" :key="rank"
                                class="px-2 py-2.5 text-center"
                                @click="toggleDocRequirement(doc, rank)">
                                <div class="flex items-center justify-center cursor-pointer">
                                    <div :class="['w-5 h-5 rounded border-2 flex items-center justify-center transition',
                                                  isRequired(doc, rank)
                                                    ? 'bg-blue-600 border-blue-600'
                                                    : 'bg-white border-gray-300 hover:border-blue-400']">
                                        <svg v-if="isRequired(doc, rank)" class="w-3 h-3 text-white" fill="none" viewBox="0 0 12 12">
                                            <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </div>
                                </div>
                            </td>

                            <!-- Delete row -->
                            <td class="px-3 py-2.5 text-center">
                                <button @click="removeDocType(doc.id)"
                                        class="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-500 transition text-base leading-none">×</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Summary legend -->
            <div v-if="clientDocTypes.length > 0" class="mt-3 flex items-center gap-4 text-[10px] text-gray-400">
                <span class="flex items-center gap-1.5">
                    <span class="w-4 h-4 rounded border-2 bg-blue-600 border-blue-600 inline-flex items-center justify-center">
                        <svg class="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    Required
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="w-4 h-4 rounded border-2 bg-white border-gray-300 inline-block"></span>
                    Not required
                </span>
                <span class="ml-auto">Click any cell to toggle · Click document name to rename · Hover row to delete</span>
            </div>
        </div>

    </div>
</div>
</script>

        <!-- Right pane: tasks -->

                <div class="text-sm font-semibold text-gray-400">Select an item from the list to view its tasks</div>
            </div>

            <!-- Tasks panel -->
            <div v-else class="flex-1 flex flex-col overflow-hidden">

                <!-- Selected RFA header -->
                <div :class="['px-6 py-4 border-b shrink-0', tabs.find(t=>t.id===activeTab).headerClass]">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="font-bold text-base leading-tight">{{ selectedRfa.rfaNo }}</div>
                            <div class="text-sm opacity-80 mt-0.5">
                                {{ selectedRfa.seafarer }} · {{ selectedRfa.rank }}
                            </div>
                            <div class="text-xs opacity-60 mt-0.5">
                                {{ selectedRfa.client }} · {{ selectedRfa.vesselName }}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-[9px] opacity-60 uppercase font-bold tracking-widest">Deadline</div>

                    </div>
                </div>

                <!-- Tasks list -->
                <div class="flex-1 overflow-y-auto px-6 py-4">

                    <!-- Task rows -->
                    <div class="space-y-2">

                            <div :class="['flex-1 text-sm font-semibold', task.done ? 'line-through text-gray-400' : 'text-slate-700']">

                            </div>
                            <!-- Cost -->
                            <div :class="['text-xs font-mono font-bold shrink-0', task.done ? 'text-gray-300' : 'text-blue-700']">
                                {{ task.cost > 0 ? '€ ' + task.cost.toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2}) : '—' }}

                </div>

                                         ? 'bg-violet-50 text-violet-700 border-violet-200'
                                         : 'bg-amber-50 text-amber-700 border-amber-200']">
                            {{ rfe.rfeStatus === 'OnSearch' ? '🔍 On Search' : '⚙ On Preparation' }}
                        </span>
                    </div>

                    <!-- Common RFA card fields -->
                    <div class="space-y-1">

                        <span v-if="acceptedCandidates.length > 0"
                              class="ml-1 bg-emerald-200 text-emerald-800 text-[9px] font-black px-1.5 py-0.5 rounded-full">
                            {{ acceptedCandidates.length }}
                        </span>
                    </button>
                    <span class="ml-auto text-[10px] text-gray-400">
                        {{ checkedCandidates.length }} selected · {{ totalCandidatesForRfe }} candidates found
                    </span>
                </div>

                <!-- Candidate groups -->
                <div class="flex-1 overflow-y-auto px-6 py-5 space-y-6">
                    <div v-for="group in candidateGroups" :key="group.id">

                        <!-- Group header -->
                        <div v-if="group.candidates.length > 0">
                            <div class="flex items-center gap-3 mb-3">
                                <div :class="['w-2.5 h-2.5 rounded-full shrink-0', group.dotClass]"></div>
                                <span class="text-xs font-black uppercase tracking-widest text-slate-600">{{ group.label }}</span>
                                <span :class="['text-[10px] font-black px-2 py-0.5 rounded-full', group.countClass]">
                                    {{ group.candidates.length }}
                                </span>
                                <div class="flex-1 h-px bg-gray-200"></div>
                            </div>

                            <!-- Candidate cards -->
                            <div class="space-y-2">
                                <div v-for="c in group.candidates" :key="c.id"
                                     :class="['rounded-xl border transition-all',
                                              c.acceptance === 'approved'   ? 'border-emerald-400 bg-emerald-50 shadow-sm' :
                                              c.acceptance === 'onApproval' ? 'border-violet-300 bg-violet-50' :
                                              c.checked ? 'border-blue-400 bg-blue-50 shadow-sm'
                                                        : 'border-gray-200 bg-white hover:border-gray-300']">
                                    <div class="px-4 py-3 flex items-start gap-3">

                                        <!-- Checkbox -->
                                        <input type="checkbox" v-model="c.checked"
                                               :disabled="c.acceptance === 'onApproval' || c.acceptance === 'approved'"
                                               class="w-4 h-4 mt-1 accent-blue-600 shrink-0 cursor-pointer">

                                        <!-- Seafarer info -->
                                        <div class="flex-1 min-w-0">

                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- OnPreparation: task list -->
                    <div v-else class="px-6 py-4">
                        <!-- Confirmed seafarer name -->
                        <div v-if="selectedRfa.confirmedSeafarer"
                             class="flex items-center gap-2 mb-4 px-3 py-2 bg-emerald-50 border border-emerald-200 rounded-lg">
                            <span class="text-emerald-600 font-black text-sm">✓</span>
                            <span class="text-sm font-bold text-emerald-800">{{ selectedRfa.confirmedSeafarer }}</span>
                            <span class="text-[10px] text-emerald-600 uppercase font-black tracking-widest ml-1">Confirmed replacement</span>
                        </div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Embarkation Tasks</div>
                            <div class="text-[10px] text-gray-400">
                                {{ (selectedRfa.rfeTasks || []).filter(t=>t.done).length }} / {{ (selectedRfa.rfeTasks || []).length }} done
                                · {{ rfrSectionCost(selectedRfa.rfeTasks) }}
                            </div>
                        </div>
                        <div v-if="!selectedRfa.rfeTasks || selectedRfa.rfeTasks.length === 0"
                             class="text-xs text-gray-400 italic py-4 text-center">
                            Task list loading…
                        </div>
                        <div v-else class="space-y-1.5">
                            <div v-for="task in selectedRfa.rfeTasks" :key="task.id"
                                 :class="['flex items-center gap-3 px-3 py-2 rounded-lg border transition-colors',
                                          task.done ? 'bg-green-50 border-green-200' : 'bg-white border-gray-200 hover:border-gray-300']">
                                <input type="checkbox" v-model="task.done"
                                       class="w-4 h-4 accent-amber-600 shrink-0 cursor-pointer">
                                <div :class="['flex-1 text-xs font-semibold', task.done ? 'line-through text-gray-400' : 'text-slate-700']">{{ task.name }}</div>
                                <div :class="['text-xs font-mono shrink-0', task.done ? 'text-gray-300' : 'text-amber-700']">
                                    {{ task.cost > 0 ? '€ ' + task.cost.toFixed(2) : '—' }}
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                                <span class="text-[10px] font-bold text-amber-600">{{ rfrSectionPct(selectedRfa.rfeTasks) }}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                                <div class="h-2 rounded-full bg-amber-500 transition-all duration-500"
                                     :style="{ width: rfrSectionPct(selectedRfa.rfeTasks) + '%' }"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>
</script>

                <span class="flex items-center gap-1">
                    <span class="inline-block w-8 h-2.5 rounded-sm" style="background:#7dd3fc;border:1px solid #0ea5e9;background-image:repeating-linear-gradient(135deg,transparent 0px,transparent 3px,rgba(255,255,255,0.6) 3px,rgba(255,255,255,0.6) 5px,transparent 5px,transparent 10px)"></span>Approval
                </span>
                <span class="flex items-center gap-1">
                    <span class="inline-block w-8 h-2.5 rounded-sm" style="background:#7dd3fc;border:1px solid #0ea5e9;background-image:radial-gradient(circle,rgba(255,255,255,0.7) 1.5px,transparent 1.5px);background-size:5px 5px"></span>Preparation
                </span>

    <!-- Gantt chart -->
    <main class="flex-1 overflow-auto">
        <div class="overflow-x-auto">
            <div :style="{ minWidth: (rankColWidth + ganttTotalDays * dayWidth) + 'px' }">

                <!-- Sticky month ruler -->
                <div class="flex border-b bg-slate-100 sticky top-0 z-30" :style="{ paddingLeft: rankColWidth + 'px' }">
                    <div v-for="m in ganttMonths" :key="m.key"
                         class="shrink-0 text-center text-[10px] font-bold text-gray-400 uppercase border-r py-1.5 tracking-wide"
                         :style="{ width: (m.days * dayWidth) + 'px' }">
                        {{ m.label }}
                    </div>
                </div>

                <!-- All vessel groups -->
                <template v-for="vessel in allFlatRows" :key="vessel.vesselId">

                    <!-- Vessel header row -->
                    <div class="flex border-b bg-slate-700 text-white" style="height:32px;">
                        <div class="shrink-0 flex items-center px-3 gap-3 justify-between"
                             :style="{ width: rankColWidth + 'px' }">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="text-[10px] font-black uppercase tracking-wide text-slate-200 truncate">{{ vessel.client }}</span>
                                <span class="text-[10px] text-slate-500">·</span>
                                <span class="text-[10px] font-semibold text-slate-300 truncate">{{ vessel.name }}</span>
                                <span class="text-[9px] text-slate-500 shrink-0">{{ vessel.type }}</span>
                            </div>
                            <button @click.stop="openModal('Embark', vessel, null)"
                                    class="shrink-0 text-[9px] font-bold px-2 py-0.5 rounded bg-blue-500 text-white hover:bg-blue-400 transition leading-none">
                                + Embark
                            </button>

                        <div class="flex-1 bg-slate-700"></div>

                    <!-- Rank rows -->

                         class="rank-row flex">

                        <!-- Sticky label column -->
                        <div class="shrink-0 flex items-center px-3 border-r"
                             :class="row.isRating ? 'bg-slate-50' : 'bg-gray-50'"
                             :style="{ width: rankColWidth + 'px' }">
                            <div class="text-[10px] font-black uppercase leading-tight truncate"
                                 :class="row.isRating ? 'text-slate-400' : 'text-slate-700'">{{ row.rank }}</div>
                        </div>

                        <!-- Chart zone -->
                        <div class="flex-1 relative" style="overflow:visible">
                            <div v-for="m in ganttMonths" :key="'g'+m.key"
                                 class="absolute inset-y-0 border-r border-gray-100 pointer-events-none"
                                 :style="{ left: (m.offsetDays * dayWidth) + 'px' }"></div>
                            <div class="today-line" :style="{ left: (todayOffset * dayWidth) + 'px' }"></div>
                            <div class="rfa-horizon-line" :style="{ left: (rfaHorizonOffset * dayWidth) + 'px' }"></div>

                            <!-- Onboard bar -->
                            <div class="gantt-bar bar-onboard"
                                 :style="barStyle(row.onboard.embark, row.onboard.signoff)"
                                 @contextmenu.prevent.stop="openContextMenu($event, vessel, row)">
                                <div class="bar-label" style="color:white;pointer-events:none">{{ row.onboard.shortName }}</div>
                            </div>

                            <!-- Signoff adjustment overlays -->
                            <template v-if="row.rfs && row.rfs.signoffDate !== row.onboard.signoff">
                                <template v-if="row.rfs.signoffDate < row.onboard.signoff">
                                    <div class="gantt-bar bar-signoff-early"
                                         :style="barStyle(row.rfs.signoffDate, row.onboard.signoff)">
                                        <div class="bar-label" style="pointer-events:none;color:#b91c1c;font-size:8px">↤ Early sign-off</div>
                                    </div>
                                </template>
                                <template v-else>
                                    <div class="gantt-bar bar-signoff-late"
                                         :style="barStyle(row.onboard.signoff, row.rfs.signoffDate)">
                                        <div class="bar-label" style="pointer-events:none;color:#166534;font-size:8px">Extended ↦</div>
                                    </div>
                                </template>
                            </template>

                            <!-- RFX bar (bottom zone) -->

                                     :style="rfaBarStyle(row.rfa)"

                                    <div class="bar-label" style="color:#134e4a">{{ row.rfa.rfaNo }} {{ rfaStatusIcon(row.rfa.status) }}</div>
                                </div>
                            </template>

                            <!-- RFP bar (bottom zone) -->
                            <template v-if="row.rfa && row.rfa.type === 'Promote' && rfaVisible(row.rfa)">
                                <div :class="['gantt-bar rfa-bottom rfa-rfp', 'rfa-'+row.rfa.status]"
                                     :style="rfaBarStyle(row.rfa)"
                                     @click.stop="openRfaModal(row.rfa, 'rfp', row, vessel)">
                                    <div class="bar-label" style="color:#3b0764">{{ row.rfa.rfaNo }} {{ rfaStatusIcon(row.rfa.status) }}</div>
                                </div>
                            </template>

                            <!-- RFS bar (top zone) -->
                            <template v-if="row.rfs">
                                <div :class="['gantt-bar rfa-top rfa-rfs', 'rfa-'+row.rfs.status]"
                                     :style="barStyle(row.rfs.dateCreated, row.rfs.signoffDate)"
                                     @click.stop="openRfaModal(row.rfs, 'rfs', row, vessel)">
                                    <div class="bar-label" style="color:#881337">{{ row.rfs.rfaNo }} {{ rfaStatusIcon(row.rfs.status) }}</div>
                                </div>
                            </template>

                            <!-- RFR dual bars -->
                            <template v-if="row.rfr_rfe">
                                <div v-if="row.rfs"
                                     :class="['gantt-bar rfa-top rfa-rfr', 'rfa-'+row.rfs.status]"
                                     :style="barStyle(row.rfs.dateCreated, row.rfs.signoffDate)"
                                     @click.stop="openRfaModal(row.rfs, 'rfr', row, vessel)">
                                    <div class="bar-label" style="color:#78350f;font-size:9px">↑ {{ row.rfs.rfaNo }}</div>
                                </div>
                                <div :class="['gantt-bar rfa-bottom rfa-rfr', 'rfa-'+row.rfr_rfe.status]"
                                     :style="barStyle(row.rfr_rfe.dateCreated, row.rfr_rfe.embarkDate)"
                                     @click.stop="openRfaModal(row.rfr_rfe, 'rfr', row, vessel)">
                                    <div class="bar-label" style="color:#78350f;font-size:9px">↓ {{ row.rfr_rfe.rfaNo }}</div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- RFE rows -->
                    <div v-for="rfe in vessel.rfeRows" :key="rfe.rfaNo" class="rfe-row flex">

                                           rfe.status === 'preparation' ? 'bg-yellow-100 text-yellow-700 border-yellow-300' :

                            </span>
                        </div>
                        <div class="flex-1 relative" style="overflow:visible">
                            <div v-for="m in ganttMonths" :key="'grfe'+m.key+rfe.rfaNo"
                                 class="absolute inset-y-0 border-r border-gray-100 pointer-events-none"
                                 :style="{ left: (m.offsetDays * dayWidth) + 'px' }"></div>
                            <div class="today-line" :style="{ left: (todayOffset * dayWidth) + 'px' }"></div>
                            <div class="rfa-horizon-line" :style="{ left: (rfaHorizonOffset * dayWidth) + 'px' }"></div>
                            <div class="gantt-bar bar-future-service" :style="barStyle(rfe.embarkDate, rfe.serviceEnd)">
                                <div class="bar-label" style="color:white;pointer-events:none">{{ rfe.rank }}</div>
                            </div>
                            <div :class="['gantt-bar rfa-bottom rfa-rfe', 'rfa-'+rfe.status]"
                                 :style="barStyle(rfe.dateCreated, rfe.embarkDate)"
                                 @click.stop="openRfaModal(rfe, 'rfe', null, vessel)">
                                <div class="bar-label" style="color:#0c4a6e;pointer-events:none">{{ rfe.rfaNo }} {{ rfaStatusIcon(rfe.status) }}</div>
                            </div>
                        </div>
                    </div>

                </template>

                <!-- Footer today / horizon labels -->
                <div class="relative border-t bg-gray-50 h-6 sticky bottom-0"
                     :style="{ paddingLeft: rankColWidth + 'px' }">
                    <div class="today-line"         :style="{ left: (rankColWidth + todayOffset * dayWidth) + 'px' }"></div>
                    <span class="today-label"       :style="{ left: (rankColWidth + todayOffset * dayWidth) + 'px' }">TODAY</span>
                    <div class="rfa-horizon-line"   :style="{ left: (rankColWidth + rfaHorizonOffset * dayWidth) + 'px' }"></div>
                    <span class="rfa-horizon-label" :style="{ left: (rankColWidth + rfaHorizonOffset * dayWidth) + 'px' }">+2 mo</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ── Context menu ─────────────────────────────────────── -->
    <div v-if="ctxMenu.visible"
         class="fixed bg-white rounded-lg shadow-2xl border border-gray-200 py-1 min-w-[220px]"
         :style="{ zIndex: 9999, top: ctxMenu.y + 'px', left: ctxMenu.x + 'px' }"
         @click.stop>
        <div class="px-4 py-2.5 border-b border-gray-100">
            <div class="font-bold text-[12px] text-slate-800 leading-tight">{{ ctxMenu.row && ctxMenu.row.onboard.name }}</div>
            <div class="text-[10px] text-slate-400 uppercase tracking-wide mt-0.5">
                {{ ctxMenu.row && ctxMenu.row.rank }} · {{ ctxMenu.vessel && ctxMenu.vessel.name }}
            </div>
            <div class="mt-1.5 space-y-0.5 text-[11px] text-gray-600" v-if="ctxMenu.row">
                <div><span class="text-gray-400">Embarked:</span> {{ ctxMenu.row.onboard.embark }}</div>
                <div><span class="text-gray-400">Est. Sign-off:</span> {{ ctxMenu.row.onboard.signoff }}</div>
                <div><span class="text-gray-400">Contract:</span> {{ ctxMenu.row.onboard.contract }}</div>
            </div>
        </div>
        <div class="py-1">
            <div class="px-3 py-1 text-[9px] font-black text-gray-400 uppercase tracking-widest">Issue RFA as</div>
            <button v-for="action in ['Extend','Replace','Promote','Sign Off']" :key="action"
                    @click.stop="openModal(action, ctxMenu.vessel, ctxMenu.row)"
                    class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 flex items-center gap-2 transition">
                <span class="text-base">{{ {Extend:'⏩', Replace:'🔄', Promote:'⬆️', 'Sign Off':'🚪'}[action] }}</span>
                {{ action }}
            </button>
        </div>
    </div>

    <!-- ── Action modal (Embark / Extend / Replace / Sign Off / Promote) ── -->
    <div v-if="modal.visible"
         class="fixed inset-0 flex items-center justify-center p-4"
         :style="{ zIndex: 9998 }"
         @click.self="modal.visible = false">
        <div class="absolute inset-0 bg-black/50" @click="modal.visible = false"></div>
        <div class="relative bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col"
             :style="{ zIndex: 9999, width: '520px', maxWidth:'96vw', maxHeight:'90vh' }"
             @click.stop>

            <!-- Header -->
            <div class="px-6 py-4 bg-slate-800 text-white flex items-center justify-between shrink-0">
                <div>
                    <div class="font-bold text-sm tracking-tight">
                        {{ {Embark:'New Embarkation (RFE)', Extend:'Extend Contract (RFX)', Replace:'Replace Seafarer (RFR)', Promote:'Promote Seafarer (RFP)', 'Sign Off':'Request For Sign-Off (RFS)'}[modal.action] }}
                    </div>
                    <div class="text-slate-400 text-xs mt-0.5" v-if="modal.vessel">
                        {{ modal.vessel.name }} · {{ modal.vessel.client }}
                    </div>
                </div>
                <span :class="['text-xs font-black px-2 py-0.5 rounded uppercase tracking-wide',
                               {Embark:'bg-sky-600', Extend:'bg-teal-600', Replace:'bg-amber-600',
                                Promote:'bg-purple-600', 'Sign Off':'bg-rose-600'}[modal.action]]">
                    {{ {Embark:'RFE', Extend:'RFX', Replace:'RFR', Promote:'RFP', 'Sign Off':'RFS'}[modal.action] }}
                </span>
            </div>

            <!-- ── Embark (RFE) form ── -->
            <div v-if="modal.action === 'Embark'" class="px-6 py-5 space-y-4 overflow-y-auto">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Vessel</label>
                    <div class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 text-sm text-gray-500 select-none">
                        {{ modal.vessel && modal.vessel.name }}
                        <span class="text-gray-400 text-xs ml-2">{{ modal.vessel && modal.vessel.client }}</span>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Rank</label>
